<style>
/* Two stacked canvases: the GPU draws the spray underneath, the page draws the crisp figure, scribbles and words on top. */
:root {
  --bg: #000; --ink: #fff; --dim: #aaa; --muted: #777; --line: #333; --panel: #000;
  --serif: "Source Serif 4", Charter, "Iowan Old Style", Georgia, serif;
  color-scheme: dark;
}
:root.light { --bg: #dddcd7; --ink: #111; --dim: #444; --muted: #666; --line: #bbb; --panel: #eeede9; color-scheme: light; }
html { height: 100%; }
body { margin: 0; min-height: 100%; overflow-x: hidden; background: var(--bg); color: var(--ink); font-family: var(--serif); }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#ink { touch-action: pan-y; }   /* vertical swipes scroll the page; horizontal ones turn the helix */
#spray { image-rendering: pixelated; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.dock[hidden], .note[hidden] { display: none; }
.dock { position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); display: flex; flex-direction: column; align-items: flex-end; gap: 8px; max-width: calc(100vw - 32px); }
.row { display: flex; gap: 8px; }
.btn { font: inherit; font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.btn:focus-visible, .seg button:focus-visible { outline: 1px solid var(--dim); outline-offset: 2px; }
.tune { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; width: 270px; max-width: 100%; max-height: calc(100vh - 120px); overflow-y: auto; box-sizing: border-box; display: grid; gap: 10px; font-size: 13px; color: var(--dim); }
.tune[hidden] { display: none; }
.tune label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
.tune input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--dim); }
.tune output, .stats { font-variant-numeric: tabular-nums; }
.tune output { color: var(--ink); }
.stats { color: var(--muted); font-size: 12px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { font: inherit; font-size: 13px; color: var(--dim); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }
.note { position: fixed; left: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); font-size: 12px; font-style: italic; color: var(--muted); max-width: 44ch; pointer-events: none; }
@media (max-width: 560px) { .note { display: none; } }
</style>
</head>

function noise3(x, y, z) {

    else { i1 = 0; j1 = 0; k1 = 1; i2 = 1; j2 = 0; k2 = 1; }
